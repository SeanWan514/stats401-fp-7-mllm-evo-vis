name: Validate website and data

on:
  push:
    branches: [main, shilin]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run data and task-view regression checks
        run: make test
      - name: Check JavaScript syntax
        run: make syntax
      - name: Test explorer evidence operations
        run: node --test tests/*.test.mjs
      - name: Build public website bundle
        run: make site
